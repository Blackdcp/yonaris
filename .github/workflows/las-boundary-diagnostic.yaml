name: LAS Boundary Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/yonaris_las
          chmod 600 ~/.ssh/yonaris_las
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect release boundary without mutation
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
        run: |
          ssh -i ~/.ssh/yonaris_las -o BatchMode=yes -o IdentitiesOnly=yes "$LAS_USER@$LAS_HOST" '
            printf "user="; id -un
            printf "uid="; id -u
            printf "groups="; id -nG
            if sudo -n true >/dev/null 2>&1; then printf "passwordless-sudo=yes\n"; else printf "passwordless-sudo=no\n"; fi
            for path in \
              /usr/local/libexec/yonaris-las/dispatch-las-command \
              /usr/local/sbin/verify-yonaris-las-forced-command \
              /etc/yonaris/las-forced-command-active \
              /home/yonaris-gate/.ssh/authorized_keys; do
              if test -e "$path"; then printf "present %s\n" "$path"; else printf "missing %s\n" "$path"; fi
            done
          '
