name: Deploy Yonaris marketing site

on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/workflows/deploy-marketing.yaml
      - apps/www/**
      - packages/api-spec/**
      - packages/config/**
      - packages/docs/**
      - packages/og/**
      - packages/ui/**
      - docker/Dockerfile.www
      - deploy/las/compose.marketing.yaml
      - deploy/las/caddy/**
      - deploy/las/bin/deploy-marketing.sh
      - deploy/las/bin/install-marketing-caddy.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yonaris-production
  queue: max
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: blackdcp

jobs:
  build:
    name: Build marketing image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.www
          target: www
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/yonaris-www:sha-${{ github.sha }}
          cache-from: type=gha,scope=www
          cache-to: type=gha,mode=max,scope=www

      - name: Verify homepage and referenced assets
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/yonaris-www:sha-${{ github.sha }}
        run: |
          container_id="$(docker run --rm --detach --pull never --publish 127.0.0.1:15161:3000 "$IMAGE_REF")"
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          node apps/www/scripts/smoke-marketing.mjs http://127.0.0.1:15161/

      - name: Push verified image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/yonaris-www:sha-${{ github.sha }}
        run: docker push "$IMAGE_REF"

  deploy:
    name: Deploy marketing
    needs:
      - build
    if: vars.LAS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://yonaris.com
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/yonaris_las
          chmod 600 ~/.ssh/yonaris_las
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable marketing release
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "flock --wait 1800 /opt/yonaris/.source-deploy.lock bash -c 'set -e; cd /opt/yonaris/source; git fetch --depth=50 origin main; git checkout --detach $RELEASE_SHA; env DEPLOY_ROOT=/opt/yonaris MARKETING_COMPOSE_FILE=/opt/yonaris/source/deploy/las/compose.marketing.yaml ENV_FILE=/opt/yonaris/.env bash /opt/yonaris/source/deploy/las/bin/deploy-marketing.sh sha-$RELEASE_SHA'"
