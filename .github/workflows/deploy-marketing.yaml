name: Deploy Yonaris marketing site

on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/workflows/deploy-marketing.yaml
      - apps/www/**
      - packages/api-spec/**
      - packages/config/**
      - packages/og/**
      - packages/ui/**
      - docker/Dockerfile.www
      - deploy/las/compose.marketing.yaml
      - deploy/las/caddy/**
      - deploy/las/bin/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yonaris-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: blackdcp

jobs:
  build:
    name: Build and prove marketing image
    runs-on: ubuntu-latest
    outputs:
      www_digest: ${{ steps.push_image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.5.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release fixtures
        run: |
          bash -n deploy/las/bin/deploy-marketing.sh
          bash -n deploy/las/bin/install-marketing-caddy.sh
          bash deploy/las/bin/deploy-marketing.test.sh
          bash deploy/las/bin/install-marketing-caddy.test.sh
          bash deploy/las/bin/dispatch-las-command.test.sh
          bash deploy/las/bin/guard-artifact-output-release.test.sh
          bash deploy/las/bin/verify-las-forced-command.test.sh
          bash deploy/las/bin/install-las-trust-policy.test.sh
          bash deploy/las/bin/manage-las-release-state.test.sh
          bash deploy/las/bin/manage-las-runtime.test.sh
          bash deploy/las/bin/manage-las-caddy.test.sh
          bash deploy/las/bin/install-las-stable-bundle.test.sh
          bash deploy/las/bin/las-final-hardening.test.sh
          bash deploy/las/bin/las-privilege-boundary.test.sh
          bash deploy/las/bin/artifact-output-language-security.test.sh
          node --test deploy/las/bin/marketing-workflow.test.mjs
          node --test deploy/las/caddy/yonaris-marketing.test.mjs
          node --test apps/www/scripts/smoke-marketing.test.mjs
          node --test apps/www/scripts/smoke-marketing-caddy.test.mjs
          pnpm --filter @workspace/www test -- src/lib/caddy-policy.test.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and load the immutable release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.www
          target: www
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/yonaris-www:sha-${{ github.sha }}
          cache-from: type=gha,scope=www
          cache-to: type=gha,mode=max,scope=www

      - name: Direct image smoke
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/yonaris-www:sha-${{ github.sha }}
        run: |
          container_id="$(docker run --rm --detach --pull never --publish 127.0.0.1:15161:3000 "$IMAGE_REF")"
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          if ! node apps/www/scripts/smoke-marketing.mjs http://127.0.0.1:15161/; then
            docker logs "$container_id"
            sleep 2
            node apps/www/scripts/smoke-marketing.mjs http://127.0.0.1:15161/ || {
              docker logs "$container_id"
              exit 1
            }
          fi

      - name: Digest-pinned Caddy integration smoke
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/yonaris-www:sha-${{ github.sha }}
        run: node apps/www/scripts/smoke-marketing-caddy.mjs "$IMAGE_REF"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the already-verified image
        id: push_image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/yonaris-www:sha-${{ github.sha }}
        run: |
          push_output="$(docker push "$IMAGE_REF")"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' | tail -n 1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Registry push did not return an immutable image digest.' >&2
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

  deploy:
    name: Deploy marketing
    needs:
      - build
    if: >-
      vars.LAS_DEPLOY_ENABLED == 'true' &&
      vars.LAS_FORCED_COMMAND_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://yonaris.com
    permissions:
      contents: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" >~/.ssh/yonaris_las
          chmod 600 ~/.ssh/yonaris_las
          printf '%s\n' "$SSH_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prove the exact forced-command boundary
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
        run: |
          probe_output="$(ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "yonaris-las-v1 probe")"
          if [[ "$probe_output" != 'yonaris-las-probe-v1 ok' ]]; then
            echo 'The LAS forced-command probe returned an unexpected response.' >&2
            exit 1
          fi
          set +e
          rejection_output="$(ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "true" 2>&1)"
          rejection_status=$?
          set -e
          if [[ "$rejection_status" -ne 2 || \
            "$rejection_output" != 'Refusing non-protocol LAS SSH command.' ]]; then
            echo 'The LAS key did not return the exact dispatcher rejection for an arbitrary command.' >&2
            exit 1
          fi

      - name: Remote secret preflight before source mutation
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: ${{ github.sha }}
          WWW_DIGEST: ${{ needs.build.outputs.www_digest }}
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "yonaris-las-v1 marketing-preflight sha-$RELEASE_SHA $WWW_DIGEST"

      - name: Lock source and deploy the exact release
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: ${{ github.sha }}
          WWW_DIGEST: ${{ needs.build.outputs.www_digest }}
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "yonaris-las-v1 marketing-deploy sha-$RELEASE_SHA $WWW_DIGEST"

      - name: Verify live marker, image, and governed health
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: ${{ github.sha }}
          WWW_DIGEST: ${{ needs.build.outputs.www_digest }}
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "yonaris-las-v1 marketing-verify sha-$RELEASE_SHA $WWW_DIGEST"
