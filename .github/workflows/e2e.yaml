# End-to-End Integration Tests
#
# Verifies the internal Docker deployment works end-to-end in two phases:
# with the worker down, seed data and run
# the fixture-dependent Playwright + Bruno suites; then start the worker
# (pointed at the no-network `stub` provider) and run the `worker` Playwright
# project, which submits a job and asserts the worker processes it. Starting
# the worker only after the fixture suites finish keeps its self-healing
# scheduler from mutating seeded data.
#
# This workflow is the SINGLE SOURCE OF TRUTH for E2E test orchestration.
# Run locally via: pnpm test:e2e-local  (replays this workflow with
# https://github.com/nektos/act); `pnpm test:e2e` runs just the fixture specs
# against an already-running stack.

name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # One file set for every `docker compose` invocation below, so no step
      # can silently run against a different effective config. The override
      # scopes the worker to the no-network stub provider.
      COMPOSE_FILE: deploy/las/compose.yaml:e2e/worker-override.yaml
      APP_ENV_FILE: ${{ github.workspace }}/e2e/.runtime.env
      E2E_SNAPSHOT_ROOT: ${{ github.workspace }}/e2e/.snapshot-fixtures
      IMAGE_TAG: e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yonaris

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Docker builds and the Playwright browser need more disk than the
      # standard hosted runner exposes after its preinstalled toolchains.
      - name: Free Disk Space
        if: ${{ !env.ACT }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm turbo check-types

      - name: Unit tests
        run: pnpm turbo test

      - name: Verify E2E Compose topology
        run: node --test scripts/e2e-compose-topology.test.mjs

      - name: Build and verify Browser Runner extension
        run: |
          pnpm --filter @workspace/browser-extension check-types
          pnpm --filter @workspace/browser-extension build
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("apps/browser-extension/dist/manifest.json", "utf8"));
          const expectedHosts = [
            "<all_urls>",
            "https://portal.yonaris.com/*",
            "https://*.doubao.com/*",
            "https://chat.deepseek.com/*",
            "https://qianwen.com/*",
            "https://www.qianwen.com/*",
            "https://www.kimi.com/*",
            "https://wenxin.baidu.com/*",
            "https://yuanbao.tencent.com/*",
            "https://chatglm.cn/*",
          ];
          const expectedPermissions = ["storage", "alarms", "tabs", "scripting", "notifications"];
          if (JSON.stringify(manifest.host_permissions) !== JSON.stringify(expectedHosts)) {
            throw new Error("Browser extension host permissions exceed the approved v1 allowlist");
          }
          if (JSON.stringify(manifest.permissions) !== JSON.stringify(expectedPermissions)) {
            throw new Error("Browser extension permissions exceed the approved v1 allowlist");
          }
          if (JSON.stringify(manifest).includes("*://*/*")) {
            throw new Error("Browser extension contains a forbidden wildcard permission");
          }
          NODE
          pnpm --filter @workspace/web package:browser-extension
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const root = "apps/web/public/downloads";
          const zip = readFileSync(`${root}/yonaris-browser-extension.zip`);
          const metadata = JSON.parse(readFileSync(`${root}/yonaris-browser-extension.json`, "utf8"));
          const digest = createHash("sha256").update(zip).digest("hex");
          if (metadata.fileName !== "yonaris-browser-extension.zip" || metadata.sha256 !== digest) {
            throw new Error("Portal Browser Runner package metadata does not match the reviewed ZIP");
          }
          NODE
          mkdir -p artifacts
          cp apps/web/public/downloads/yonaris-browser-extension.zip \
            "$GITHUB_WORKSPACE/artifacts/yonaris-browser-extension-${GITHUB_SHA}.zip"

      - name: Upload Browser Runner extension
        uses: actions/upload-artifact@v7
        with:
          name: yonaris-browser-extension-${{ github.sha }}
          path: artifacts/yonaris-browser-extension-${{ github.sha }}.zip
          retention-days: 30

      # This is a local fixture only. It proves the Browser Runner executes a
      # complete batch and produces evidence without contacting Doubao or any
      # other consumer surface.
      - name: Run Browser Runner fixture smoke
        run: |
          state_dir="$(mktemp -d)"
          trap 'rm -rf "$state_dir"' EXIT
          pnpm --filter @workspace/browser-runner start -- run \
            --fixture fixtures/doubao-smoke.json \
            --state-dir "$state_dir"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm -C e2e exec playwright install chromium --with-deps

      - name: Run public-site browser tests
        id: public-site-tests
        run: pnpm --filter e2e run test:www

      - name: Run public-site analytics privacy test
        id: public-site-analytics-tests
        run: pnpm --filter e2e run test:www:analytics

      - name: Upload public-site failure results
        if: ${{ failure() && steps.public-site-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: public-site-test-results
          path: e2e/test-results-www/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload public-site analytics failure results
        if: ${{ failure() && steps.public-site-analytics-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: public-site-analytics-test-results
          path: e2e/test-results-www/analytics/
          if-no-files-found: warn
          retention-days: 7

      - name: Storybook tests
        run: pnpm -C apps/web test:storybook

      - name: Prepare internal E2E runtime configuration
        run: |
          mkdir -p e2e/.snapshot-fixtures
          printf '%s\n' \
            'DATABASE_URL=postgresql://postgres:postgres@postgres:5432/yonaris' \
            'BETTER_AUTH_SECRET=e2e-session-secret-with-at-least-thirty-two-characters' \
            'SCRAPE_TARGETS=stub:stub' \
            'DEPLOYMENT_MODE=local' \
            'APP_URL=http://localhost:1515' \
            'ADMIN_API_KEYS=test-api-key-e2e' \
            'CREDENTIAL_ENCRYPTION_KEY=BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=' \
            'ONBOARDING_LLM_TARGET=stub:stub' \
            'BROWSER_RUNNER_ENABLED=true' \
            'SENTRY_DSN=https://examplePublicKey@o0.ingest.sentry.io/0' \
            > e2e/.runtime.env

      # Build all images so a broken worker (or db-migrate) Dockerfile fails CI
      # here. web/worker/migrate share the base/deps/builder stages, so BuildKit
      # builds those once — building all three costs little more than building
      # web alone. postgres is an image pull, so `build` skips it.
      - name: Build images
        run: docker compose build

      # Start web only (with its deps db-migrate + postgres). The worker stays
      # down for now — it comes up in phase 2, after the fixture suites run.
      - name: Start web
        run: |
          chmod 0777 e2e/.snapshot-fixtures
          docker compose up -d --no-build web

      - name: Wait for web
        run: |
          echo "Waiting for web to be ready on http://localhost:1515..."
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:1515/ 2>/dev/null; then
              echo "Web is ready."
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: Web did not become ready in time."
          docker compose logs
          exit 1

      - name: Seed test data
        run: pnpm -C e2e exec tsx seed.ts

      # Phase 1 — worker still down. Run everything that reads the seeded
      # fixtures, so no background job can mutate them mid-suite.
      - name: Run Playwright E2E tests
        run: pnpm -C e2e exec playwright test --project=fixtures

      - name: Run Bruno API tests
        run: pnpm test:api

      # Sampling owns a separate delivery batch so its mutations cannot race
      # with the fixture readers. This validates the frozen denominator,
      # server-managed evidence, observation ledger, and analytics handoff;
      # it deliberately does not contact or impersonate a consumer AI site.
      - name: Run sampling delivery test
        run: pnpm -C e2e exec playwright test --project=sampling --reporter=list,github
        env:
          E2E_SKIP_AUTH_SETUP: "true"

      # Phase 2 — bring the worker up and prove it processes a submitted job.
      # No readiness wait: the job the spec submits is durable in pg-boss, so
      # the spec's own DB poll absorbs worker startup.
      - name: Start worker
        run: docker compose up -d --no-build worker

      # `github` keeps PR annotations on failure; omitting `html` leaves phase
      # 1's playwright-report/ untouched for the upload below.
      - name: Run worker job-processing test
        run: pnpm -C e2e exec playwright test --project=worker --reporter=list,github
        env:
          E2E_SKIP_AUTH_SETUP: "true"

      - name: Dump service logs
        if: ${{ failure() && hashFiles('deploy/las/compose.yaml') != '' }}
        run: docker compose logs web worker

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: |
            e2e/test-results/
            e2e/test-results-sampling/
            e2e/test-results-worker/
          retention-days: 7
