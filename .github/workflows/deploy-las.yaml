  deploy:
    name: Deploy production
    needs:
      - production-candidate-slot
      - build-images
      - e2e-gate
      - mode-compat-gate
      - response-snapshot-storage-contract
    if: vars.LAS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: yonaris-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://portal.yonaris.com
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/yonaris_las
          chmod 600 ~/.ssh/yonaris_las
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Recover the reviewed immutable release through the last working LAS account
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: 9302baaa1e729d3d8b80bfdfb501e5ee4e5ec248
          WEB_DIGEST: sha256:c2c2acc1ec3c5149f6ca808629b9c00d774add47616fefd1a321b2257c98992f
          WORKER_DIGEST: sha256:3ca0f291a169f81863f1d83cff8fdb0f8c7abdae79b70e9f22f155a8f90a277a
          MIGRATE_DIGEST: sha256:230c461525ce49da29b4282d51721f1ca5169ba99e3c0b8e704a356c492d03eb
          POSTGRES_DIGEST: sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "flock --wait 1800 /opt/yonaris/.source-deploy.lock bash -c 'set -Eeuo pipefail; git config --global --add safe.directory /opt/yonaris/source; cd /opt/yonaris/source; git fetch --depth=400 origin main; git checkout --detach $RELEASE_SHA; recovery_root=\$(mktemp -d /tmp/yonaris-legacy-root.XXXXXX); trap \"rm -rf -- \$recovery_root\" EXIT; git archive 18d05597d013add06eb3d4c5f493c3918862de91 deploy/las/bin | tar -x -C \"\$recovery_root\"; ln -s /opt/yonaris/source/packages \"\$recovery_root/packages\"; recovery_dir=\$recovery_root/deploy/las/bin; chmod 700 \"\$recovery_dir/deploy.sh\"; env WEB_IMAGE_DIGEST=$WEB_DIGEST WORKER_IMAGE_DIGEST=$WORKER_DIGEST MIGRATE_IMAGE_DIGEST=$MIGRATE_DIGEST POSTGRES_IMAGE_DIGEST=$POSTGRES_DIGEST DEPLOY_ROOT=/opt/yonaris COMPOSE_FILE=/opt/yonaris/source/deploy/las/compose.yaml ENV_FILE=/opt/yonaris/.env bash \"\$recovery_dir/deploy.sh\" sha-$RELEASE_SHA'"

