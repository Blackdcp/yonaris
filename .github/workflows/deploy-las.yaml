            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid sampling batch request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import json
          import pathlib
          import sys

          try:
              request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"Invalid sampling batch request: {exc}")
          expected = {
              "schemaVersion": 1,
              "operation": "run-sampling-batch",
              "requestId": "stepfun-cn-doubao-6x-20260816-v6",
              "manifestPath": "apps/worker/src/sampling-batch-requests/stepfun-cn-doubao-6x-20260816-v6.json",
          }
          if request != expected:
              raise SystemExit("Sampling batch request does not match the approved fixed contract.")
          PY
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
            echo "Approved sampling batch request count: 1"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  overseas_formal_run_plan:
    if: ${{ false }}
    name: Plan approved overseas formal one-shot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect and validate checked-in overseas formal request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/overseas-formal-runs/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one approved overseas formal request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid overseas formal request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import json
          import pathlib
          import sys

          request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 1,
              "operation": "run-overseas-formal-one-shot",
              "requestId": "stepfun-us-chatgpt-1x-20260816",
              "manifestPath": "apps/worker/src/overseas-formal-run-requests/stepfun-us-chatgpt-1x-20260816.json",
          }
          if request != expected:
              raise SystemExit("Overseas formal request does not match the approved fixed contract.")
          PY
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
            echo "Approved overseas formal request count: 1"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  reviewed_consumer_cohort_import_plan:
    if: ${{ false }}
    name: Plan reviewed consumer cohort import
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect and validate reviewed consumer import request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/reviewed-consumer-cohort-imports/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one reviewed consumer import request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid reviewed consumer import request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import json
          import pathlib
          import sys

          request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 1,
              "operation": "import-reviewed-consumer-cohort",
              "requestId": "stepfun-local-pc-deepseek-18-20260814",
              "manifestPath": "apps/worker/src/reviewed-consumer-cohorts/stepfun-local-pc-deepseek-18-20260814.json",
              "manifestFingerprint": "6864b6ac382b53d5b174d8860bd50b1a31e2ffc5ee9589e9564e2ab5afc6663f",
          }
          if request != expected:
              raise SystemExit("Reviewed consumer import request does not match the fixed contract.")
          PY
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  program_locale_repair_plan:
    if: ${{ false }}
    name: Plan approved Program locale repair
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect and validate Program locale repair request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/program-locale-repairs/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one Program locale repair request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid Program locale repair request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import json
          import pathlib
          import sys

          request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 1,
              "operation": "repair-program-locale",
              "requestId": "ppio-cn-zh-20260817",
              "manifestPath": "apps/worker/src/program-locale-repair-requests/ppio-cn-zh-20260817.json",
          }
          if request != expected:
              raise SystemExit("Program locale repair request does not match the fixed contract.")
          PY
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  program_import_plan:
    if: ${{ false }}
    name: Plan approved Program import
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect and validate Program import request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/program-imports/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one Program import request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid Program import request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import json
          import pathlib
          import sys

          request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 1,
              "operation": "import-program",
              "requestId": "ppio-global-en-20260817",
              "manifestPath": "apps/worker/src/program-import-requests/ppio-global-en-20260817.json",
          }
          if request != expected:
              raise SystemExit("Program import request does not match the fixed contract.")
          PY
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  response_snapshot_backfill_plan:
    if: ${{ false }}
    name: Plan reviewed response snapshot backfill
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect and validate reviewed snapshot backfill request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/response-snapshot-backfills/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one reviewed response snapshot backfill request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid response snapshot backfill request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import datetime
          import json
          import pathlib
          import re
          import sys

          request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          common = {
              "schemaVersion", "operation", "requestId", "brandId", "fromObservedAt",
              "toObservedAtExclusive", "channelsExact", "runIds", "expectedRunCount",
              "expectedRunFingerprint", "sourceCommitSha",
          }
          brand_id = request.get("brandId")
          required = common if brand_id == "stepfun" else common | {"sourceFailureCode"} if brand_id == "ppio" else set()
          if set(request) != required:
              raise SystemExit("Snapshot backfill request contains unexpected fields.")
          if request["schemaVersion"] != 1 or request["operation"] != "backfill-response-snapshots":
              raise SystemExit("Snapshot backfill request does not match the reviewed fixed contract.")
          if brand_id == "ppio" and request.get("sourceFailureCode") != "snapshot_contract_invalid":
              raise SystemExit("PPIO backfill requires sourceFailureCode snapshot_contract_invalid.")
          if not isinstance(request["requestId"], str) or not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,99}", request["requestId"]):
              raise SystemExit("Snapshot backfill requestId is invalid.")
          run_ids = request["runIds"]
          channels = request["channelsExact"]
          if not isinstance(run_ids, list) or not run_ids or run_ids != sorted(set(run_ids)):
              raise SystemExit("Snapshot backfill runIds must be a non-empty sorted unique list.")
          uuid = re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}")
          if not all(isinstance(run_id, str) and uuid.fullmatch(run_id) for run_id in run_ids):
              raise SystemExit("Snapshot backfill runIds are invalid.")
          if request["expectedRunCount"] != len(run_ids):
              raise SystemExit("Snapshot backfill expectedRunCount does not match runIds.")
          if not isinstance(channels, list) or not 1 <= len(channels) <= 20 or channels != sorted(set(channels)) or not all(isinstance(channel, str) and re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,99}", channel) for channel in channels):
              raise SystemExit("Snapshot backfill channelsExact must be a non-empty sorted unique list.")
          if not re.fullmatch(r"[0-9a-f]{64}", request["expectedRunFingerprint"]):
              raise SystemExit("Snapshot backfill fingerprint is invalid.")
          if not re.fullmatch(r"[0-9a-f]{40}", request["sourceCommitSha"]):
              raise SystemExit("Snapshot backfill source SHA is invalid.")
          try:
              start = datetime.datetime.fromisoformat(request["fromObservedAt"].replace("Z", "+00:00"))
              end = datetime.datetime.fromisoformat(request["toObservedAtExclusive"].replace("Z", "+00:00"))
          except (AttributeError, ValueError) as exc:
              raise SystemExit(f"Snapshot backfill observation window is invalid: {exc}")
          canonical = lambda value: value.isoformat(timespec="milliseconds").replace("+00:00", "Z")
          if start.tzinfo is None or end.tzinfo is None or canonical(start) != request["fromObservedAt"] or canonical(end) != request["toObservedAtExclusive"] or start >= end:
              raise SystemExit("Snapshot backfill observation window is invalid.")
          PY
            bash deploy/las/bin/run-response-snapshot-backfill.sh \
              --validate-source-provenance "${requests[0]}" "$GITHUB_SHA"
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  e2e-gate:
    name: E2E gate
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yaml

  mode-compat-gate:
    name: Deployment smoke gate
    permissions:
      contents: read
    uses: ./.github/workflows/mode-compat.yaml

  production-candidate-slot:
    name: Select latest pending production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: yonaris-production
      cancel-in-progress: false
    steps:
      - name: Register latest candidate
        run: echo "Production candidate selected."

  response-snapshot-storage-contract:
    name: Response snapshot storage contract
    runs-on: ubuntu-latest
    concurrency:
      group: yonaris-response-contract-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify response snapshot host assets
        shell: bash
        run: |
          run_contract_test() {
            local script="$1"
            if ! bash "$script"; then
              echo "::error file=$script::Production contract test failed: $script"
              return 1
            fi
          }

          bash deploy/las/bin/prepare-response-snapshot-storage.test.sh
          bash deploy/las/bin/check-response-snapshot-storage.test.sh
          bash deploy/las/bin/export-response-snapshots.test.sh
          bash deploy/las/bin/run-response-snapshot-backfill.test.sh
          bash deploy/las/bin/activate-response-snapshot-storage.test.sh
          bash deploy/las/bin/audit-overseas-formal-readiness.test.sh
          bash deploy/las/bin/run-overseas-formal-one-shot.test.sh
          bash deploy/las/bin/guard-artifact-output-release.test.sh
          bash deploy/las/bin/dispatch-las-command.test.sh
          bash deploy/las/bin/verify-las-forced-command.test.sh
          bash deploy/las/bin/install-las-trust-policy.test.sh
          bash deploy/las/bin/manage-las-release-state.test.sh
          run_contract_test deploy/las/bin/manage-las-runtime.test.sh
          run_contract_test deploy/las/bin/manage-las-caddy.test.sh
          run_contract_test deploy/las/bin/install-las-stable-bundle.test.sh
          run_contract_test deploy/las/bin/las-final-hardening.test.sh
          bash deploy/las/bin/las-privilege-boundary.test.sh
          bash deploy/las/bin/artifact-output-language-security.test.sh
          bash -n \
            deploy/las/bin/prepare-response-snapshot-storage.sh \
            deploy/las/bin/check-response-snapshot-storage.sh \
            deploy/las/bin/export-response-snapshots.sh \
            deploy/las/bin/run-response-snapshot-backfill.sh \
            deploy/las/bin/activate-response-snapshot-storage.sh \
            deploy/las/bin/audit-overseas-formal-readiness.sh \
            deploy/las/bin/run-overseas-formal-one-shot.sh \
            deploy/las/bin/guard-artifact-output-release.sh \
            deploy/las/bin/dispatch-las-command.sh \
            deploy/las/bin/verify-las-forced-command.sh \
            deploy/las/bin/install-las-trust-policy.sh \
            deploy/las/bin/manage-las-release-state.sh \
            deploy/las/bin/manage-las-runtime.sh \
            deploy/las/bin/manage-las-caddy.sh \
            deploy/las/bin/install-las-stable-bundle.sh \
            deploy/las/bin/run-las-active-bundle.sh \
            deploy/las/bin/load-strict-dotenv.sh \
            deploy/las/bin/deploy.sh

  build-images:
    name: Build immutable images
    runs-on: ubuntu-latest
    concurrency:
      group: yonaris-image-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      web_digest: ${{ steps.build_web.outputs.digest }}
      worker_digest: ${{ steps.build_worker.outputs.digest }}
      migrate_digest: ${{ steps.build_migrate.outputs.digest }}
      postgres_digest: ${{ steps.postgres_digest.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bind the reviewed Postgres registry digest
        id: postgres_digest
        env:
          POSTGRES_DIGEST: ${{ vars.LAS_POSTGRES_IMAGE_DIGEST || 'sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3' }}
        run: |
          if [[ ! "$POSTGRES_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'LAS_POSTGRES_IMAGE_DIGEST must be an exact reviewed sha256 registry digest.' >&2
            exit 1
          fi
          echo "digest=$POSTGRES_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        id: build_web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/yonaris-web:sha-${{ github.sha }}
