name: Deploy Yonaris to LAS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-las.yaml
      - .github/workflows/e2e.yaml
      - .github/workflows/mode-compat.yaml
      - apps/browser-runner/**
      - apps/web/**
      - apps/worker/**
      - e2e/**
      - packages/**
      - docker/Dockerfile
      - docker/entrypoint.sh
      - deploy/las/compose.yaml
      - deploy/las/env.example
      - deploy/las/bin/**
      - deploy/las/browser-runner/**
      - deploy/las/browser-runner-activation/**
      - deploy/las/sampling-batch-operations/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yonaris-production
  queue: max
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: blackdcp

jobs:
  browser_runner_activation_plan:
    name: Plan approved Browser Runner activation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect checked-in activation request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/browser-runner-activation/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one approved Browser Runner activation request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid Browser Runner activation request filename." >&2
              exit 1
            fi
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
            echo "Approved Browser Runner activation request count: 1"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  report_operation_plan:
    name: Plan approved report operations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_requests: ${{ steps.plan.outputs.has_requests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect checked-in report requests
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(apps/worker/src/report-requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one approved report request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            echo "has_requests=true" >> "$GITHUB_OUTPUT"
            echo "Approved report request count: 1"
          else
            echo "has_requests=false" >> "$GITHUB_OUTPUT"
          fi

  sampling_batch_operation_plan:
    name: Plan approved sampling batch operation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect and validate checked-in sampling batch request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/sampling-batch-operations/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one approved sampling batch request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid sampling batch request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import json
          import pathlib
          import sys

          try:
              request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"Invalid sampling batch request: {exc}")
          expected = {
              "schemaVersion": 1,
              "operation": "run-sampling-batch",
              "requestId": "stepfun-cn-doubao-6x-20260813",
              "manifestPath": "apps/worker/src/sampling-batch-requests/stepfun-cn-doubao-6x-20260813.json",
          }
          if request != expected:
              raise SystemExit("Sampling batch request does not match the approved fixed contract.")
          PY
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
            echo "Approved sampling batch request count: 1"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  e2e-gate:
    name: E2E gate
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yaml

  mode-compat-gate:
    name: Deployment smoke gate
    permissions:
      contents: read
    uses: ./.github/workflows/mode-compat.yaml

  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            target: web
            image: yonaris-web
          - name: worker
            target: worker
            image: yonaris-worker
          - name: db-migrate
            target: migrate
            image: yonaris-db-migrate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy production
    needs:
      - build-images
      - e2e-gate
      - mode-compat-gate
    if: vars.LAS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://portal.yonaris.com
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/yonaris_las
          chmod 600 ~/.ssh/yonaris_las
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable release
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "flock --wait 1800 /opt/yonaris/.source-deploy.lock bash -c 'set -e; cd /opt/yonaris/source; git fetch --depth=50 origin main; git checkout --detach $RELEASE_SHA; env DEPLOY_ROOT=/opt/yonaris COMPOSE_FILE=/opt/yonaris/source/deploy/las/compose.yaml ENV_FILE=/opt/yonaris/.env bash /opt/yonaris/source/deploy/las/bin/deploy.sh sha-$RELEASE_SHA'"

  report-operations:
    name: Run approved production report operations
    needs:
      - deploy
      - report_operation_plan
    if: needs.deploy.result == 'success' && needs.report_operation_plan.outputs.has_requests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://portal.yonaris.com/reports
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/yonaris_las
          chmod 600 ~/.ssh/yonaris_las
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Execute idempotent database report requests
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "flock --wait 1800 /opt/yonaris/.source-deploy.lock bash -c 'set -e; cd /opt/yonaris/source; test \"\$(git rev-parse HEAD)\" = \"$RELEASE_SHA\"; env DEPLOY_ROOT=/opt/yonaris COMPOSE_FILE=/opt/yonaris/source/deploy/las/compose.yaml ENV_FILE=/opt/yonaris/.env bash /opt/yonaris/source/deploy/las/bin/run-report-requests.sh sha-$RELEASE_SHA'"

  sampling-batch-operation:
    name: Run approved production sampling batch operation
    needs:
      - deploy
      - sampling_batch_operation_plan
    if: needs.deploy.result == 'success' && needs.sampling_batch_operation_plan.outputs.has_request == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://portal.yonaris.com/admin/sampling
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/yonaris_las
          chmod 600 ~/.ssh/yonaris_las
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Execute the idempotent fixed sampling batch operation
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: ${{ github.sha }}
          REQUEST_NAME: ${{ needs.sampling_batch_operation_plan.outputs.request_name }}
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "flock --wait 1800 /opt/yonaris/.source-deploy.lock bash -c 'set -e; cd /opt/yonaris/source; test \"\$(git rev-parse HEAD)\" = \"$RELEASE_SHA\"; env DEPLOY_ROOT=/opt/yonaris COMPOSE_FILE=/opt/yonaris/source/deploy/las/compose.yaml ENV_FILE=/opt/yonaris/.env bash /opt/yonaris/source/deploy/las/bin/run-sampling-batch-operation.sh sha-$RELEASE_SHA /opt/yonaris/source/deploy/las/sampling-batch-operations/requests/$REQUEST_NAME'"

  browser-runner-activation:
    name: Activate the approved Browser Runner principal
    needs:
      - deploy
      - browser_runner_activation_plan
    if: needs.deploy.result == 'success' && needs.browser_runner_activation_plan.outputs.has_request == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://portal.yonaris.com
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/yonaris_las
          chmod 600 ~/.ssh/yonaris_las
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Execute the idempotent Browser Runner activation
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: ${{ github.sha }}
          REQUEST_NAME: ${{ needs.browser_runner_activation_plan.outputs.request_name }}
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "flock --wait 1800 /opt/yonaris/.source-deploy.lock bash -c 'set -e; cd /opt/yonaris/source; test \"\$(git rev-parse HEAD)\" = \"$RELEASE_SHA\"; env DEPLOY_ROOT=/opt/yonaris COMPOSE_FILE=/opt/yonaris/source/deploy/las/compose.yaml ENV_FILE=/opt/yonaris/.env bash /opt/yonaris/source/deploy/las/bin/activate-browser-runner.sh sha-$RELEASE_SHA /opt/yonaris/source/deploy/las/browser-runner-activation/requests/$REQUEST_NAME'"
