name: Deploy Yonaris to LAS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-las.yaml
      - .github/workflows/e2e.yaml
      - .github/workflows/mode-compat.yaml
      - apps/browser-runner/**
      - apps/web/**
      - apps/worker/**
      - e2e/**
      - packages/**
      - docker/Dockerfile
      - docker/entrypoint.sh
      - deploy/las/compose.yaml
      - deploy/las/env.example
      - deploy/las/bin/**
      - deploy/las/browser-runner/**
      - deploy/las/browser-runner-activation/**
      - deploy/las/response-snapshot-activation/**
      - deploy/las/response-snapshot-backfills/**
      - deploy/las/reviewed-consumer-cohort-imports/**
      - deploy/las/sampling-batch-operations/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yonaris-production
  queue: max
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: blackdcp

jobs:
  response_snapshot_activation_plan:
    name: Plan approved response snapshot activation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect checked-in response snapshot activation request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/response-snapshot-activation/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one approved response snapshot activation request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid response snapshot activation request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import json
          import pathlib
          import sys

          request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 1,
              "operation": "enable-response-snapshot-storage",
              "hostRoot": "/var/lib/yonaris/response-snapshots/v1",
              "containerRoot": "/var/lib/yonaris/response-snapshots/v1",
              "retentionDays": 90,
              "warnUsedPercent": 70,
              "stopUsedPercent": 80,
              "outboxTtlHours": 24,
          }
          if request != expected:
              raise SystemExit("Response snapshot activation request does not match the approved fixed contract.")
          PY
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
            echo "Approved response snapshot activation request count: 1"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  browser_runner_activation_plan:
    name: Plan approved Browser Runner activation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect checked-in activation request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/browser-runner-activation/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one approved Browser Runner activation request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid Browser Runner activation request filename." >&2
              exit 1
            fi
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
            echo "Approved Browser Runner activation request count: 1"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  report_operation_plan:
    name: Plan approved report operations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_requests: ${{ steps.plan.outputs.has_requests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect checked-in report requests
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(apps/worker/src/report-requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one approved report request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            echo "has_requests=true" >> "$GITHUB_OUTPUT"
            echo "Approved report request count: 1"
          else
            echo "has_requests=false" >> "$GITHUB_OUTPUT"
          fi

  sampling_batch_operation_plan:
    name: Plan approved sampling batch operation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect and validate checked-in sampling batch request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/sampling-batch-operations/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one approved sampling batch request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid sampling batch request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import json
          import pathlib
          import sys

          try:
              request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"Invalid sampling batch request: {exc}")
          expected = {
              "schemaVersion": 1,
              "operation": "run-sampling-batch",
              "requestId": "stepfun-cn-doubao-6x-20260816-v5",
              "manifestPath": "apps/worker/src/sampling-batch-requests/stepfun-cn-doubao-6x-20260816-v5.json",
          }
          if request != expected:
              raise SystemExit("Sampling batch request does not match the approved fixed contract.")
          PY
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
            echo "Approved sampling batch request count: 1"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  overseas_formal_run_plan:
    name: Plan approved overseas formal one-shot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect and validate checked-in overseas formal request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/overseas-formal-runs/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one approved overseas formal request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid overseas formal request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import json
          import pathlib
          import sys

          request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 1,
              "operation": "run-overseas-formal-one-shot",
              "requestId": "stepfun-us-chatgpt-1x-20260816",
              "manifestPath": "apps/worker/src/overseas-formal-run-requests/stepfun-us-chatgpt-1x-20260816.json",
          }
          if request != expected:
              raise SystemExit("Overseas formal request does not match the approved fixed contract.")
          PY
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
            echo "Approved overseas formal request count: 1"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  reviewed_consumer_cohort_import_plan:
    name: Plan reviewed consumer cohort import
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect and validate reviewed consumer import request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/reviewed-consumer-cohort-imports/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one reviewed consumer import request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid reviewed consumer import request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import json
          import pathlib
          import sys

          request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 1,
              "operation": "import-reviewed-consumer-cohort",
              "requestId": "stepfun-local-pc-deepseek-18-20260814",
              "manifestPath": "apps/worker/src/reviewed-consumer-cohorts/stepfun-local-pc-deepseek-18-20260814.json",
              "manifestFingerprint": "6864b6ac382b53d5b174d8860bd50b1a31e2ffc5ee9589e9564e2ab5afc6663f",
          }
          if request != expected:
              raise SystemExit("Reviewed consumer import request does not match the fixed contract.")
          PY
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  response_snapshot_backfill_plan:
    name: Plan reviewed response snapshot backfill
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect and validate reviewed snapshot backfill request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/response-snapshot-backfills/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one reviewed response snapshot backfill request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid response snapshot backfill request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import datetime
          import json
          import pathlib
          import re
          import sys

          request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          required = {
              "schemaVersion", "operation", "requestId", "brandId", "fromObservedAt",
              "toObservedAtExclusive", "channelsExact", "runIds", "expectedRunCount",
              "expectedRunFingerprint", "sourceCommitSha",
          }
          if set(request) != required:
              raise SystemExit("Snapshot backfill request contains unexpected fields.")
          if request["schemaVersion"] != 1 or request["operation"] != "backfill-response-snapshots" or request["brandId"] != "stepfun":
              raise SystemExit("Snapshot backfill request does not match the reviewed fixed contract.")
          if not isinstance(request["requestId"], str) or not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,99}", request["requestId"]):
              raise SystemExit("Snapshot backfill requestId is invalid.")
          run_ids = request["runIds"]
          channels = request["channelsExact"]
          if not isinstance(run_ids, list) or not run_ids or run_ids != sorted(set(run_ids)):
              raise SystemExit("Snapshot backfill runIds must be a non-empty sorted unique list.")
          uuid = re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}")
          if not all(isinstance(run_id, str) and uuid.fullmatch(run_id) for run_id in run_ids):
              raise SystemExit("Snapshot backfill runIds are invalid.")
          if request["expectedRunCount"] != len(run_ids):
              raise SystemExit("Snapshot backfill expectedRunCount does not match runIds.")
          if not isinstance(channels, list) or not 1 <= len(channels) <= 20 or channels != sorted(set(channels)) or not all(isinstance(channel, str) and re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,99}", channel) for channel in channels):
              raise SystemExit("Snapshot backfill channelsExact must be a non-empty sorted unique list.")
          if not re.fullmatch(r"[0-9a-f]{64}", request["expectedRunFingerprint"]):
              raise SystemExit("Snapshot backfill fingerprint is invalid.")
          if not re.fullmatch(r"[0-9a-f]{40}", request["sourceCommitSha"]):
              raise SystemExit("Snapshot backfill source SHA is invalid.")
          try:
              start = datetime.datetime.fromisoformat(request["fromObservedAt"].replace("Z", "+00:00"))
              end = datetime.datetime.fromisoformat(request["toObservedAtExclusive"].replace("Z", "+00:00"))
          except (AttributeError, ValueError) as exc:
              raise SystemExit(f"Snapshot backfill observation window is invalid: {exc}")
          canonical = lambda value: value.isoformat(timespec="milliseconds").replace("+00:00", "Z")
          if start.tzinfo is None or end.tzinfo is None or canonical(start) != request["fromObservedAt"] or canonical(end) != request["toObservedAtExclusive"] or start >= end:
              raise SystemExit("Snapshot backfill observation window is invalid.")
          PY
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  e2e-gate:
    name: E2E gate
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yaml

  mode-compat-gate:
    name: Deployment smoke gate
    permissions:
      contents: read
    uses: ./.github/workflows/mode-compat.yaml

  response-snapshot-storage-contract:
    name: Response snapshot storage contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify response snapshot host assets
        shell: bash
        run: |
          bash deploy/las/bin/prepare-response-snapshot-storage.test.sh
          bash deploy/las/bin/check-response-snapshot-storage.test.sh
          bash deploy/las/bin/export-response-snapshots.test.sh
          bash deploy/las/bin/run-response-snapshot-backfill.test.sh
          bash deploy/las/bin/activate-response-snapshot-storage.test.sh
          bash deploy/las/bin/audit-overseas-formal-readiness.test.sh
          bash deploy/las/bin/run-overseas-formal-one-shot.test.sh
          bash -n \
            deploy/las/bin/prepare-response-snapshot-storage.sh \
            deploy/las/bin/check-response-snapshot-storage.sh \
            deploy/las/bin/export-response-snapshots.sh \
            deploy/las/bin/run-response-snapshot-backfill.sh \
            deploy/las/bin/activate-response-snapshot-storage.sh \
            deploy/las/bin/audit-overseas-formal-readiness.sh \
            deploy/las/bin/run-overseas-formal-one-shot.sh \
            deploy/las/bin/deploy.sh

  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            target: web
            image: yonaris-web
          - name: worker
            target: worker
            image: yonaris-worker
          - name: db-migrate
            target: migrate
            image: yonaris-db-migrate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy production
    needs:
      - build-images
      - e2e-gate
      - mode-compat-gate
      - response-snapshot-storage-contract
    if: vars.LAS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://portal.yonaris.com
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/yonaris_las
          chmod 600 ~/.ssh/yonaris_las
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable release
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "flock --wait 1800 /opt/yonaris/.source-deploy.lock bash -c 'set -e; cd /opt/yonaris/source; git fetch --depth=50 origin main; git checkout --detach $RELEASE_SHA; env DEPLOY_ROOT=/opt/yonaris COMPOSE_FILE=/opt/yonaris/source/deploy/las/compose.yaml ENV_FILE=/opt/yonaris/.env bash /opt/yonaris/source/deploy/las/bin/deploy.sh sha-$RELEASE_SHA'"

  report-operations:
    name: Run approved production report operations
    needs:
      - deploy
      - report_operation_plan
    if: needs.deploy.result == 'success' && needs.report_operation_plan.outputs.has_requests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://portal.yonaris.com/reports
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/yonaris_las
          chmod 600 ~/.ssh/yonaris_las
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Execute idempotent database report requests
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "flock --wait 1800 /opt/yonaris/.source-deploy.lock bash -c 'set -e; cd /opt/yonaris/source; test \"\$(git rev-parse HEAD)\" = \"$RELEASE_SHA\"; env DEPLOY_ROOT=/opt/yonaris COMPOSE_FILE=/opt/yonaris/source/deploy/las/compose.yaml ENV_FILE=/opt/yonaris/.env bash /opt/yonaris/source/deploy/las/bin/run-report-requests.sh sha-$RELEASE_SHA'"

  overseas-formal-readiness:
    name: Audit StepFun overseas formal readiness
    needs:
      - deploy
      - response-snapshot-activation
    if: needs.deploy.result == 'success' && needs['response-snapshot-activation'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://portal.yonaris.com/app/stepfun
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/yonaris_las
          chmod 600 ~/.ssh/yonaris_las
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read the sanitized formal-run readiness report
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$LAS_USER@$LAS_HOST" \
            "flock --wait 1800 /opt/yonaris/.source-deploy.lock bash -c 'set -e; cd /opt/yonaris/source; test \"\$(git rev-parse HEAD)\" = \"$RELEASE_SHA\"; env DEPLOY_ROOT=/opt/yonaris COMPOSE_FILE=/opt/yonaris/source/deploy/las/compose.yaml ENV_FILE=/opt/yonaris/.env bash /opt/yonaris/source/deploy/las/bin/audit-overseas-formal-readiness.sh sha-$RELEASE_SHA'"

  overseas-formal-one-shot:
    name: Run approved StepFun overseas formal one-shot
    needs:
      - deploy
      - response-snapshot-activation
      - overseas-formal-readiness
      - overseas_formal_run_plan
    if: >-
      needs.deploy.result == 'success' &&
      needs['response-snapshot-activation'].result == 'success' &&
      needs['overseas-formal-readiness'].result == 'success' &&
      needs.overseas_formal_run_plan.outputs.has_request == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://portal.yonaris.com/app/stepfun
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LAS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/yonaris_las
          chmod 600 ~/.ssh/yonaris_las
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Execute the fixed three-call overseas cohort
        env:
          LAS_HOST: ${{ secrets.LAS_HOST }}
          LAS_USER: ${{ secrets.LAS_USER }}
          RELEASE_SHA: ${{ github.sha }}
          REQUEST_NAME: ${{ needs.overseas_formal_run_plan.outputs.request_name }}
        run: |
          ssh -i ~/.ssh/yonaris_las \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$LAS_USER@$LAS_HOST" \
            "flock --wait 1800 /opt/yonaris/.source-deploy.lock bash -c 'set -e; cd /opt/yonaris/source; test \"\$(git rev-parse HEAD)\" = \"$RELEASE_SHA\"; env DEPLOY_ROOT=/opt/yonaris COMPOSE_FILE=/opt/yonaris/source/deploy/las/compose.yaml ENV_FILE=/opt/yonaris/.env bash /opt/yonaris/source/deploy/las/bin/run-overseas-formal-one-shot.sh sha-$RELEASE_SHA /opt/yonaris/source/deploy/las/overseas-formal-runs/requests/$REQUEST_NAME'"

  response-snapshot-activation:
    name: Activate approved response snapshot storage
    needs:
      - deploy
      - response_snapshot_activation_plan
    if: needs.deploy.result == 'success' && needs.response_snapshot_activation_plan.outputs.has_request == 'true'
    runs-on: ubuntu-latest
