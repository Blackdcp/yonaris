name: Deploy Yonaris to LAS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-las.yaml
      - .github/workflows/e2e.yaml
      - .github/workflows/mode-compat.yaml
      - apps/browser-extension/**
      - apps/browser-runner/**
      - apps/web/**
      - apps/worker/**
      - e2e/**
      - packages/**
      - docker/Dockerfile
      - docker/entrypoint.sh
      - deploy/las/compose.yaml
      - deploy/las/env.example
      - deploy/las/artifact-output-language-compatible
      - deploy/las/bin/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: blackdcp

jobs:
  response_snapshot_activation_plan:
    if: ${{ false }}
    name: Plan approved response snapshot activation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect checked-in response snapshot activation request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/response-snapshot-activation/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one approved response snapshot activation request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid response snapshot activation request filename." >&2
              exit 1
            fi
            python3 - "${requests[0]}" <<'PY'
          import json
          import pathlib
          import sys

          request = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "schemaVersion": 1,
              "operation": "enable-response-snapshot-storage",
              "hostRoot": "/var/lib/yonaris/response-snapshots/v1",
              "containerRoot": "/var/lib/yonaris/response-snapshots/v1",
              "retentionDays": 90,
              "warnUsedPercent": 70,
              "stopUsedPercent": 80,
              "outboxTtlHours": 24,
          }
          if request != expected:
              raise SystemExit("Response snapshot activation request does not match the approved fixed contract.")
          PY
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
            echo "Approved response snapshot activation request count: 1"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  browser_runner_activation_plan:
    if: ${{ false }}
    name: Plan approved Browser Runner activation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect checked-in activation request
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(deploy/las/browser-runner-activation/requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one approved Browser Runner activation request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            request_name="$(basename -- "${requests[0]}")"
            if [[ ! "$request_name" =~ ^[a-z0-9][a-z0-9._-]{0,95}\.json$ ]]; then
              echo "Invalid Browser Runner activation request filename." >&2
              exit 1
            fi
            echo "has_request=true" >> "$GITHUB_OUTPUT"
            echo "request_name=$request_name" >> "$GITHUB_OUTPUT"
            echo "Approved Browser Runner activation request count: 1"
          else
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            echo "request_name=" >> "$GITHUB_OUTPUT"
          fi

  report_operation_plan:
    if: ${{ false }}
    name: Plan approved report operations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_requests: ${{ steps.plan.outputs.has_requests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect checked-in report requests
        id: plan
        shell: bash
        run: |
          shopt -s nullglob
          requests=(apps/worker/src/report-requests/*.json)
          if (( ${#requests[@]} > 1 )); then
            echo "Only one approved report request is allowed per release." >&2
            exit 1
          elif (( ${#requests[@]} == 1 )); then
            echo "has_requests=true" >> "$GITHUB_OUTPUT"
            echo "Approved report request count: 1"
          else
            echo "has_requests=false" >> "$GITHUB_OUTPUT"
          fi

  sampling_batch_operation_plan:
    if: ${{ false }}
    name: Plan approved sampling batch operation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_request: ${{ steps.plan.outputs.has_request }}
      request_name: ${{ steps.plan.outputs.request_name }}
    steps:
      - name: Checkout
