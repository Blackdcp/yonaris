# Deployment smoke tests (issue #341)
#
# Protects the elmo-cloud build-out (issue #8): open-source (local), demo, and
# whitelabel deployments must keep booting unchanged while cloud lands.
#
# One job, one `pnpm install`, two concerns:
#   1. Boot smoke  — every non-cloud mode in a single process: env validation +
#                    deployment-factory resolution + auth initialization. No DB.
#   2. Migrations  — apply to an empty DB, seed an existing local install, then
#                    re-apply so a future backfill (e.g. #339 brands->org) that
#                    breaks on existing data fails here before merge.
#
# Runs on every push/PR (no path filter): the job is cheap — one install, an
# in-process boot smoke, and ~15s of migration checks — so a mode-boot or
# migration regression is caught regardless of which files changed.

name: Deployment Smoke Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mode-compat-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Used by the migration steps below. The boot smoke ignores this and
      # supplies its own dummy env per mode (it never connects to a DB).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/elmo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test LAS Sampling storage preflight
        run: bash deploy/las/bin/check-sampling-storage.test.sh

      - name: Test targeted LAS image cleanup
        run: bash deploy/las/bin/prune-superseded-images.test.sh

      - name: Test rehearsal PostgreSQL readiness
        run: bash deploy/las/bin/wait-rehearsal-postgres.test.sh

      - name: Test LAS bootstrap owner deployment gate
        run: bash deploy/las/bin/deploy-bootstrap-owner.test.sh

      - name: Test idempotent LAS report operations
        run: bash deploy/las/bin/run-report-requests.test.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 1. Boot smoke — all non-cloud modes in one process.
      - name: Boot smoke (local, demo, whitelabel)
        run: pnpm -C apps/web exec tsx scripts/smoke-deployment-mode.ts

      # 2. Migrations — fail if they don't apply cleanly, or (once #339 lands)
      #    if a backfill breaks on the seeded existing-install data.
      - name: Apply migrations to an empty database
        run: pnpm -C packages/lib exec drizzle-kit migrate

      - name: Seed an existing local install
        run: pnpm -C e2e exec tsx seed.ts

      - name: Rewind seeded database to 0021
        run: |
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE public.overseas_run_calls;
          DROP TABLE public.overseas_run_cohorts;
          DROP TABLE public.browser_runner_device_brands;
          DROP TABLE public.browser_runner_pairings;
          DROP TABLE public.browser_runner_devices;
          DROP TABLE public.response_snapshot_access_events;
          DROP TABLE public.response_snapshot_outbox;
          DROP TABLE public.response_snapshots;
          DROP TYPE public.response_snapshot_access_action;
          DROP TYPE public.response_snapshot_capture_method;
          DROP TYPE public.response_snapshot_content_source;
          DROP TYPE public.response_snapshot_status;
          DROP TYPE public.response_snapshot_storage_backend;
          DROP TYPE public.overseas_run_call_status;
          DROP TYPE public.overseas_run_cohort_status;
          ALTER TABLE public.brand_opportunities DROP CONSTRAINT brand_opportunities_scope_fk;
          DROP INDEX public.brand_opportunities_brand_scope_created_at_idx;
          ALTER TABLE public.brand_opportunities DROP COLUMN scope_id;
          CREATE INDEX brand_opportunities_brand_id_created_at_idx ON public.brand_opportunities USING btree (brand_id, created_at);
          DELETE FROM drizzle.__drizzle_migrations
          WHERE created_at IN (1786726866790, 1786893768101, 1786985859772, 1787019758271);
          DELETE FROM drizzle.__drizzle_migrations
          WHERE created_at IN (1787023000000, 1787205263160, 1787244569161, 1787325725764);
          SQL
          test "$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command \
            'select count(*) from drizzle.__drizzle_migrations;')" = "22"

      - name: Upgrade seeded 0021 data to latest without changing Elmo inputs
        shell: bash
        run: |
          set -euo pipefail

          hash_table() {
            local table_name="$1"
            psql "$DATABASE_URL" --no-psqlrc --quiet \
              --command "\\copy (select * from public.${table_name} order by 1) to stdout with (format binary)" \
              | sha256sum \
              | cut -d' ' -f1
          }

          tables=(brands measurement_scopes prompts competitors prompt_runs citations)
          declare -A before
          for table_name in "${tables[@]}"; do
            before["$table_name"]="$(hash_table "$table_name")"
          done

          pnpm -C packages/lib exec drizzle-kit migrate

          for table_name in "${tables[@]}"; do
            after="$(hash_table "$table_name")"
            test "$after" = "${before[$table_name]}" || {
              echo "Post-0021 migrations changed seeded Elmo input table: $table_name" >&2
              exit 1
            }
          done

          test "$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command \
             'select count(*) from drizzle.__drizzle_migrations;')" = "30"
