name: yonaris

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres@${POSTGRES_IMAGE_DIGEST:?Set the root-authorized Postgres image digest}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the production env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the production env file}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256mb
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

  db-migrate:
    image: ghcr.io/blackdcp/yonaris-db-migrate@${MIGRATE_IMAGE_DIGEST:?Set the root-authorized migration image digest}
    env_file:
      - path: ${APP_ENV_FILE:?Set APP_ENV_FILE to the absolute production env file path}
        required: true
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - operations
    restart: "no"
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

  account-ops:
    image: ghcr.io/blackdcp/yonaris-worker@${WORKER_IMAGE_DIGEST:?Set the root-authorized worker image digest}
    env_file:
      - path: ${APP_ENV_FILE:?Set APP_ENV_FILE to the absolute production env file path}
        required: true
    volumes:
      - ${RESPONSE_SNAPSHOT_HOST_ROOT:-/var/lib/yonaris/response-snapshots/v1}:${RESPONSE_SNAPSHOT_ROOT:-/var/lib/yonaris/response-snapshots/v1}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - operations
    restart: "no"
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  web:
    image: ghcr.io/blackdcp/yonaris-web@${WEB_IMAGE_DIGEST:?Set the root-authorized web image digest}
    env_file:
      - path: ${APP_ENV_FILE:?Set APP_ENV_FILE to the absolute production env file path}
        required: true
    volumes:
      - ${RESPONSE_SNAPSHOT_HOST_ROOT:-/var/lib/yonaris/response-snapshots/v1}:${RESPONSE_SNAPSHOT_ROOT:-/var/lib/yonaris/response-snapshots/v1}
    ports:
      - "127.0.0.1:${WEB_PORT:-1515}:3000"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

  worker:
    image: ghcr.io/blackdcp/yonaris-worker@${WORKER_IMAGE_DIGEST:?Set the root-authorized worker image digest}
    env_file:
      - path: ${APP_ENV_FILE:?Set APP_ENV_FILE to the absolute production env file path}
        required: true
    volumes:
      - ${RESPONSE_SNAPSHOT_HOST_ROOT:-/var/lib/yonaris/response-snapshots/v1}:${RESPONSE_SNAPSHOT_ROOT:-/var/lib/yonaris/response-snapshots/v1}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 2g
    cpus: 1.5
    logging: *default-logging

networks:
  backend:
    name: yonaris_backend

volumes:
  postgres_data:
    name: yonaris_postgres_data
