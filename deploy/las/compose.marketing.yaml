name: yonaris-marketing

services:
  www:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-blackdcp}/yonaris-www:${IMAGE_TAG:?Set IMAGE_TAG in the production env file}
    environment:
      MARKETING_DIAGNOSTIC_DELIVERY_MODE: ${MARKETING_DIAGNOSTIC_DELIVERY_MODE:-resend}
      MARKETING_LEAD_RECIPIENT: ${MARKETING_LEAD_RECIPIENT:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    ports:
      - "127.0.0.1:1516:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
