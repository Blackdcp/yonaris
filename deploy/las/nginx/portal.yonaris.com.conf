# This file adds Yonaris without changing the existing api.cheng-zi-ai.com or
# default 127.0.0.1:4173 server blocks.

server {
    listen 80;
    listen [::]:80;
    server_name portal.yonaris.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:1515;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name yonaris.com;

    return 302 https://portal.yonaris.com$request_uri;
}
