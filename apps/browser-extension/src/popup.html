<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Yonaris Browser Runner</title>
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<main>
			<header>
				<p class="eyebrow">Yonaris</p>
				<h1>Browser Runner</h1>
			</header>
			<section id="paired" hidden>
				<p class="status ready">Paired and ready</p>
				<p id="device-summary" class="muted"></p>
				<div id="channels" class="channels"></div>
				<div id="manual-recovery" hidden>
					<p class="muted">Stopped browser sessions</p>
					<div id="manual-recovery-list" class="recovery-list"></div>
				</div>
				<button id="run-now" type="button">Check for work now</button>
				<button id="inspect-search-evidence" type="button" class="secondary">Inspect active search evidence (read only)</button>
				<div id="search-evidence-report" class="evidence-report" hidden>
					<p id="search-evidence-summary" class="muted"></p>
					<ul id="search-evidence-candidates"></ul>
					<button id="copy-search-evidence" type="button" class="secondary">Copy redacted report</button>
				</div>
				<button id="refresh" type="button">Refresh status</button>
				<button id="disconnect" type="button" class="secondary">Disconnect</button>
			</section>
			<form id="pairing-form">
				<label for="portal-url">Portal</label>
				<input id="portal-url" value="https://portal.yonaris.com" readonly />
				<label for="pairing-code">One-time pairing code</label>
				<input id="pairing-code" autocomplete="off" maxlength="200" required />
				<button id="pair" type="submit">Pair this Chrome</button>
			</form>
			<button id="inspect-surface" type="button" class="secondary">Check current AI page (read only)</button>
			<p id="message" role="status" class="muted"></p>
		</main>
		<script src="popup.js"></script>
	</body>
</html>
